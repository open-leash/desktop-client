name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  public-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Public boundary audit
        run: npm run audit:public

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Engine image
        run: docker build -f apps/engine/Dockerfile -t leash-engine:ci .

      - name: Upgrade tests
        run: npm run test:upgrade

      - name: Runner cleanup tests
        run: |
          npm run test:runner
          python3 -m unittest scripts/test_release_pipeline.py

      - name: Installer and release entrypoint syntax
        run: |
          bash -n scripts/install-openleash-personal.sh scripts/smoke-macos-installer.sh scripts/smoke-personal-release.sh
          node --check scripts/postgres-test-container.mjs scripts/test-cloud-postgres-upgrades.mjs
          python3 -m py_compile scripts/run-openleash.py scripts/release_pipeline.py release.py test.py

      - name: Deployment readiness
        run: npm run test:deployment:public

      - name: Product smoke
        run: npm run smoke:product:public

  native-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test local proxy
        run: cargo test --manifest-path apps/local-proxy/Cargo.toml

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze mobile
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test mobile
        working-directory: apps/mobile
        run: flutter test
