name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Public boundary audit
        run: npm run audit:public

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upgrade tests
        run: npm run test:upgrade

      - name: Deployment readiness
        run: npm run test:deployment:public

      - name: Product smoke
        run: npm run smoke:product:public
