name: Release Leash for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout desktop client
        uses: actions/checkout@v7
        with:
          path: apps/desktop-client

      - name: Checkout shared contracts
        uses: actions/checkout@v7
        with:
          repository: open-leash/shared
          ref: v0.2.1
          path: packages/shared

      - name: Checkout public release tooling
        uses: actions/checkout@v7
        with:
          repository: open-leash/openleash
          ref: main
          path: platform

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Create release workspace
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"private":true,"workspaces":["packages/*","apps/*"]}' > package.json
          cp platform/scripts/install-openleash-personal.sh apps/desktop-client/scripts/install-openleash-personal.sh
          npm install

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./apps/desktop-client/package.json').version")
          test "v$package_version" = "${{ github.ref_name }}"

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          npm run build -w @openleash/shared
          npm run typecheck -w @openleash/desktop-client
          npm run test -w @openleash/desktop-client
          npm run build -w @openleash/desktop-client

      - name: Build unsigned development DMG
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps/desktop-client
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          npx electron-rebuild -v 43.3.0 -w better-sqlite3 --force
          npx electron-builder --config electron-builder.mac.yml --mac --arm64 --publish never

      - name: Verify unsigned development package
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps/desktop-client
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find release/macos -type d -name 'Leash.app' -print -quit)
          test -n "$app_path"
          test -x "$app_path/Contents/MacOS/Leash"
          test -x "$app_path/Contents/Resources/app.asar.unpacked/dist/openleash-island"

      - name: Require production signing and notarization credentials
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Build signed and notarized production DMG
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop-client
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          npx electron-rebuild -v 43.3.0 -w better-sqlite3 --force
          node - <<'NODE'
          const fs = require("node:fs");
          const yaml = require("js-yaml");
          const config = yaml.load(fs.readFileSync("electron-builder.mac.yml", "utf8"));
          config.forceCodeSigning = true;
          delete config.mac.identity;
          config.mac.notarize = true;
          fs.writeFileSync("electron-builder.mac.release.yml", yaml.dump(config));
          NODE
          npx electron-builder --config electron-builder.mac.release.yml --mac --arm64 --publish never

      - name: Verify production signature and notarization
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop-client
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find release/macos -type d -name 'Leash.app' -print -quit)
          dmg_path=$(find release/macos -maxdepth 1 -type f -name 'Leash-*.dmg' -print -quit)
          test -n "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Create checksums
        working-directory: apps/desktop-client/release/macos
        shell: bash
        run: |
          set -euo pipefail
          cp ../../scripts/install-openleash-personal.sh .
          chmod +x install-openleash-personal.sh
          shasum -a 256 Leash-*.dmg *.blockmap latest-mac.yml install-openleash-personal.sh > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Leash-macOS-arm64-${{ github.ref_name }}
          path: |
            apps/desktop-client/release/macos/*.dmg
            apps/desktop-client/release/macos/*.blockmap
            apps/desktop-client/release/macos/latest-mac.yml
            apps/desktop-client/release/macos/install-openleash-personal.sh
            apps/desktop-client/release/macos/SHA256SUMS

      - name: Attach immutable assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop-client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" release/macos/*.dmg release/macos/*.blockmap release/macos/latest-mac.yml release/macos/install-openleash-personal.sh release/macos/SHA256SUMS --clobber
