appId: com.openleash.personal
productName: OpenLeash
copyright: Copyright © 2026 OpenLeash
electronVersion: 40.10.6
npmRebuild: false
forceCodeSigning: true
extraMetadata:
  main: apps/desktop-client/dist/main.js
directories:
  output: release/personal
files:
  - apps/desktop-client/dist/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/build/Release/*.node
  - apps/desktop-client/dist/openleash-island
  - apps/desktop-client/dist/notice.html
  - apps/desktop-client/dist/openleash-icon.png
  - apps/desktop-client/dist/Fireworks.json
  - apps/desktop-client/dist/lottie.min.js
  - apps/desktop-client/dist/agent-icons/**/*
  - apps/desktop-client/dist/agent-mascots/**/*
extraResources:
  - from: scripts/install-openleash-personal.sh
    to: install-openleash-personal.sh
mac:
  identity: Developer ID Application
  icon: apps/desktop-client/build/openleash.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  notarize: true
  entitlements: apps/desktop-client/build/entitlements.mac.plist
  entitlementsInherit: apps/desktop-client/build/entitlements.mac.inherit.plist
win:
  icon: apps/desktop-client/build/openleash.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
dmg:
  title: OpenLeash
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
