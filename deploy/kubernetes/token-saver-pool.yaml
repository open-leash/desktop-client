apiVersion: v1
kind: ConfigMap
metadata:
  name: openleash-plugin-runtime
data:
  OPENLEASH_PLUGIN_ENDPOINTS: '{"openleash.prompt-compression":"http://openleash-token-saver:8080","openleash.blast-radius":"http://openleash-blast-radius:8080","openleash.sensitive-access":"http://openleash-sensitive-access:8080","openleash.dlp":"http://openleash-data-leakage-prevention:8080","openleash.rules-enforcer":"http://openleash-rules-enforcer:8080","openleash.mcp-scanner":"http://openleash-mcp-scanner:8080","openleash.code-scanner":"http://openleash-code-scanner:8080","openleash.skill-scanner":"http://openleash-skill-scanner:8080","openleash.siem-exporter":"http://openleash-siem-exporter:8080"}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openleash-token-saver
  labels:
    app.kubernetes.io/name: openleash-token-saver
    app.kubernetes.io/component: plugin-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openleash-token-saver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openleash-token-saver
        openleash.com/plugin-id: openleash.prompt-compression
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: openleash-token-saver
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plugin
          image: ghcr.io/open-leash/plugin-token-saver:1.1.3@sha256:a4b393aaea6867516c800e0c8381e03a451750a497d76870725dc8d3eaf1ffd3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OPENLEASH_PLUGIN_RUNTIME_SECRET
              valueFrom:
                secretKeyRef:
                  name: openleash-plugin-runtime
                  key: shared-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openleash-token-saver
spec:
  selector:
    app.kubernetes.io/name: openleash-token-saver
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openleash-token-saver
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openleash-token-saver
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openleash-token-saver
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openleash-token-saver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openleash-token-saver-deny-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openleash-token-saver
  policyTypes: ["Egress"]
  egress: []
