apiVersion: apps/v1
kind: Deployment
metadata:
  name: openleash-blast-radius
  labels:
    app.kubernetes.io/name: openleash-blast-radius
    app.kubernetes.io/component: plugin-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openleash-blast-radius
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openleash-blast-radius
        openleash.com/plugin-id: openleash.blast-radius
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plugin
          image: ghcr.io/open-leash/plugin-blast-radius:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OPENLEASH_PLUGIN_ID
              value: openleash.blast-radius
            - name: OPENLEASH_PLUGIN_RUNTIME_SECRET
              valueFrom:
                secretKeyRef:
                  name: openleash-plugin-runtime
                  key: shared-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openleash-blast-radius
spec:
  selector:
    app.kubernetes.io/name: openleash-blast-radius
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openleash-blast-radius
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openleash-blast-radius
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openleash-blast-radius-deny-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openleash-blast-radius
  policyTypes: ["Egress"]
  egress: []
---
