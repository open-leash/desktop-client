name: openleash-private-cloud

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${OPENLEASH_POSTGRES_DB:-openleash}
      POSTGRES_USER: ${OPENLEASH_POSTGRES_USER:-openleash}
      POSTGRES_PASSWORD: ${OPENLEASH_POSTGRES_PASSWORD:?Set a strong OPENLEASH_POSTGRES_PASSWORD}
    volumes:
      - openleash-private-cloud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENLEASH_POSTGRES_USER:-openleash} -d ${OPENLEASH_POSTGRES_DB:-openleash}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${OPENLEASH_IMAGE_REGISTRY:-ghcr.io/open-leash}/client-api:${OPENLEASH_VERSION:-0.36.34@sha256:b8300d86690e509f0b765e2fff28136e9ea5bde21eb46b7b09a1fe38a735b376}
    profiles: ["setup"]
    environment:
      DATABASE_URL: postgres://${OPENLEASH_POSTGRES_USER:-openleash}:${OPENLEASH_POSTGRES_PASSWORD:?Set OPENLEASH_POSTGRES_PASSWORD}@postgres:5432/${OPENLEASH_POSTGRES_DB:-openleash}
    command: ["node", "apps/client-api/dist/migrate.js", "--apply"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: ${OPENLEASH_IMAGE_REGISTRY:-ghcr.io/open-leash}/client-api:${OPENLEASH_VERSION:-0.36.34@sha256:b8300d86690e509f0b765e2fff28136e9ea5bde21eb46b7b09a1fe38a735b376}
    profiles: ["setup"]
    environment:
      DATABASE_URL: postgres://${OPENLEASH_POSTGRES_USER:-openleash}:${OPENLEASH_POSTGRES_PASSWORD:?Set OPENLEASH_POSTGRES_PASSWORD}@postgres:5432/${OPENLEASH_POSTGRES_DB:-openleash}
    command: ["node", "apps/client-api/dist/create-organization.js", "--name", "${OPENLEASH_ORG_NAME:-OpenLeash Private Cloud}", "--slug", "${OPENLEASH_ORG_SLUG:-self-hosted}", "--mode", "private", "--setup-completed", "false"]
    depends_on:
      postgres:
        condition: service_healthy

  client-api:
    image: ${OPENLEASH_IMAGE_REGISTRY:-ghcr.io/open-leash}/client-api:${OPENLEASH_VERSION:-0.36.34@sha256:b8300d86690e509f0b765e2fff28136e9ea5bde21eb46b7b09a1fe38a735b376}
    environment:
      DATABASE_URL: postgres://${OPENLEASH_POSTGRES_USER:-openleash}:${OPENLEASH_POSTGRES_PASSWORD:?Set OPENLEASH_POSTGRES_PASSWORD}@postgres:5432/${OPENLEASH_POSTGRES_DB:-openleash}
      OPENLEASH_API_PORT: 9318
      OPENLEASH_API_SURFACE: client
      OPENLEASH_DEPLOYMENT_MODE: private
      OPENLEASH_DEV_ORG_SLUG: ${OPENLEASH_ORG_SLUG:-self-hosted}
      OPENLEASH_RELEASE_ADMIN_TOKEN: ${OPENLEASH_RELEASE_ADMIN_TOKEN:-}
      OPENLEASH_MODEL_KEY_ENCRYPTION_KEY: ${OPENLEASH_MODEL_KEY_ENCRYPTION_KEY:?Set OPENLEASH_MODEL_KEY_ENCRYPTION_KEY}
      OPENLEASH_PROVIDER_USAGE_ENCRYPTION_KEY: ${OPENLEASH_PROVIDER_USAGE_ENCRYPTION_KEY:?Set OPENLEASH_PROVIDER_USAGE_ENCRYPTION_KEY}
      OPENLEASH_SECRET_KEY: ${OPENLEASH_SECRET_KEY:?Set OPENLEASH_SECRET_KEY}
      OPENLEASH_PLUGIN_ENDPOINTS: '{"openleash.prompt-compression":"http://token-saver:8080","openleash.blast-radius":"http://blast-radius:8080","openleash.sensitive-access":"http://sensitive-access:8080","openleash.dlp":"http://data-leakage-prevention:8080","openleash.rules-enforcer":"http://rules-enforcer:8080","openleash.mcp-scanner":"http://mcp-scanner:8080","openleash.code-scanner":"http://code-scanner:8080","openleash.skill-scanner":"http://skill-scanner:8080","openleash.siem-exporter":"http://siem-exporter:8080"}'
      OPENLEASH_PLUGIN_RUNTIME_SECRET: ${OPENLEASH_PLUGIN_RUNTIME_SECRET:?Set OPENLEASH_PLUGIN_RUNTIME_SECRET}
    ports:
      - "${OPENLEASH_CLIENT_API_PORT:-9318}:9318"
    depends_on:
      postgres:
        condition: service_healthy
      token-saver:
        condition: service_healthy
      blast-radius:
        condition: service_healthy
      sensitive-access:
        condition: service_healthy
      data-leakage-prevention:
        condition: service_healthy
      rules-enforcer:
        condition: service_healthy
      mcp-scanner:
        condition: service_healthy
      code-scanner:
        condition: service_healthy
      skill-scanner:
        condition: service_healthy
      siem-exporter:
        condition: service_healthy
    networks:
      - default
      - plugin-runtime

  token-saver:
    image: ${OPENLEASH_PLUGIN_IMAGE_REGISTRY:-ghcr.io/open-leash}/plugin-token-saver:${OPENLEASH_TOKEN_SAVER_VERSION:-1.1.3@sha256:a4b393aaea6867516c800e0c8381e03a451750a497d76870725dc8d3eaf1ffd3}
    environment:
      OPENLEASH_PLUGIN_RUNTIME_SECRET: ${OPENLEASH_PLUGIN_RUNTIME_SECRET:?Set OPENLEASH_PLUGIN_RUNTIME_SECRET}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    volumes:
      - openleash-private-cloud-token-saver:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - plugin-runtime

  dashboard-api:
    image: ${OPENLEASH_IMAGE_REGISTRY:-ghcr.io/open-leash}/client-api:${OPENLEASH_VERSION:-0.36.34@sha256:b8300d86690e509f0b765e2fff28136e9ea5bde21eb46b7b09a1fe38a735b376}
    environment:
      DATABASE_URL: postgres://${OPENLEASH_POSTGRES_USER:-openleash}:${OPENLEASH_POSTGRES_PASSWORD:?Set OPENLEASH_POSTGRES_PASSWORD}@postgres:5432/${OPENLEASH_POSTGRES_DB:-openleash}
      OPENLEASH_API_PORT: 9319
      OPENLEASH_API_SURFACE: dashboard
      OPENLEASH_DEPLOYMENT_MODE: private
      OPENLEASH_DEV_ORG_SLUG: ${OPENLEASH_ORG_SLUG:-self-hosted}
      OPENLEASH_PRIVATE_BOOTSTRAP_TOKEN: ${OPENLEASH_PRIVATE_BOOTSTRAP_TOKEN:?Set OPENLEASH_PRIVATE_BOOTSTRAP_TOKEN}
      OPENLEASH_ALLOWED_ORIGINS: ${OPENLEASH_DASHBOARD_ORIGIN:?Set OPENLEASH_DASHBOARD_ORIGIN}
      OPENLEASH_MODEL_KEY_ENCRYPTION_KEY: ${OPENLEASH_MODEL_KEY_ENCRYPTION_KEY:?Set OPENLEASH_MODEL_KEY_ENCRYPTION_KEY}
      OPENLEASH_PROVIDER_USAGE_ENCRYPTION_KEY: ${OPENLEASH_PROVIDER_USAGE_ENCRYPTION_KEY:?Set OPENLEASH_PROVIDER_USAGE_ENCRYPTION_KEY}
      OPENLEASH_SECRET_KEY: ${OPENLEASH_SECRET_KEY:?Set OPENLEASH_SECRET_KEY}
      IDENTITY_LOADER_URL: ${OPENLEASH_IDENTITY_LOADER_URL:-http://identity-loader:8080}
    ports:
      - "${OPENLEASH_DASHBOARD_API_PORT:-9319}:9319"
    depends_on:
      postgres:
        condition: service_healthy
      identity-loader:
        condition: service_healthy

  identity-loader:
    image: ${OPENLEASH_IDENTITY_LOADER_IMAGE:-ghcr.io/open-leash/identity-loader:${OPENLEASH_IDENTITY_LOADER_VERSION:-0.36.31@sha256:7c413856f9ab1cfd52e61565012401b9784ea31c09befc4cc57b9f35feeb2879}}
    build:
      context: ../../IdentityLoader/IdentityLoader
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${OPENLEASH_POSTGRES_USER:-openleash}:${OPENLEASH_POSTGRES_PASSWORD:?Set OPENLEASH_POSTGRES_PASSWORD}@postgres:5432/${OPENLEASH_POSTGRES_DB:-openleash}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "dotnet", "IdentityLoader.dll", "--health-check", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

  dashboard-web:
    image: ${OPENLEASH_DASHBOARD_WEB_IMAGE:-ghcr.io/open-leash/dashboard-web:0.1.8@sha256:cc6e5db4b553b72f9e3f070c3eb1eb5fe4b23101b311241c4f9572c4a7123486}
    environment:
      OPENLEASH_API_URL: ${OPENLEASH_DASHBOARD_API_URL:?Set the browser-reachable dashboard API URL}
      NEXT_PUBLIC_OPENLEASH_API_URL: ${OPENLEASH_DASHBOARD_API_URL:?Set the browser-reachable dashboard API URL}
      OPENLEASH_CLIENT_API_URL: ${OPENLEASH_CLIENT_API_URL:?Set the browser-reachable client API URL}
      OPENLEASH_TENANT_DOMAIN: ${OPENLEASH_TENANT_DOMAIN:-openleash.local}
      OPENLEASH_DASHBOARD_PORT: 9300
      PORT: 9300
    ports:
      - "${OPENLEASH_DASHBOARD_WEB_PORT:-9300}:9300"
    depends_on:
      - dashboard-api

  blast-radius:
    image: ${OPENLEASH_PLUGIN_IMAGE_REGISTRY:-ghcr.io/open-leash}/plugin-blast-radius:${OPENLEASH_BLAST_RADIUS_VERSION:-1.0.3@sha256:1c3f8e3063d84d6a1344491c2c2be5635d70f13cbee62362913b03e502b8b10f}
    environment:
      OPENLEASH_PLUGIN_ID: openleash.blast-radius
      OPENLEASH_PLUGIN_RUNTIME_SECRET: ${OPENLEASH_PLUGIN_RUNTIME_SECRET:?Set OPENLEASH_PLUGIN_RUNTIME_SECRET}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - plugin-runtime

  sensitive-access:
    image: ${OPENLEASH_PLUGIN_IMAGE_REGISTRY:-ghcr.io/open-leash}/plugin-sensitive-access:${OPENLEASH_SENSITIVE_ACCESS_VERSION:-1.0.0@sha256:ca0b01b5f001a624733a0e1417625225806b1f02b73249babf064e24241e75ce}
    environment:
      OPENLEASH_PLUGIN_ID: openleash.sensitive-access
      OPENLEASH_PLUGIN_RUNTIME_SECRET: ${OPENLEASH_PLUGIN_RUNTIME_SECRET:?Set OPENLEASH_PLUGIN_RUNTIME_SECRET}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - plugin-runtime

  data-leakage-prevention:
    image: ${OPENLEASH_PLUGIN_IMAGE_REGISTRY:-ghcr.io/open-leash}/plugin-data-leakage-prevention:${OPENLEASH_DATA_LEAKAGE_PREVENTION_VERSION:-1.0.0@sha256:df368f0dec7df9022e5f8204730e44660ae8eb56f733a49afd528f8911e25dbe}
    environment:
      OPENLEASH_PLUGIN_ID: openleash.dlp
      OPENLEASH_PLUGIN_RUNTIME_SECRET: ${OPENLEASH_PLUGIN_RUNTIME_SECRET:?Set OPENLEASH_PLUGIN_RUNTIME_SECRET}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - plugin-runtime

  rules-enforcer:
    image: ${OPENLEASH_PLUGIN_IMAGE_REGISTRY:-ghcr.io/open-leash}/plugin-rules-enforcer:${OPENLEASH_RULES_ENFORCER_VERSION:-1.0.0@sha256:b39fc2580e02d46b20672341278080b57c40e9e8869136c01cb10c98ade9f7f1}
    environment:
      OPENLEASH_PLUGIN_ID: openleash.rules-enforcer
      OPENLEASH_PLUGIN_RUNTIME_SECRET: ${OPENLEASH_PLUGIN_RUNTIME_SECRET:?Set OPENLEASH_PLUGIN_RUNTIME_SECRET}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - plugin-runtime

  mcp-scanner:
    image: ${OPENLEASH_PLUGIN_IMAGE_REGISTRY:-ghcr.io/open-leash}/plugin-mcp-scanner:${OPENLEASH_MCP_SCANNER_VERSION:-1.0.0@sha256:34d1568441f4b1ba5b5a067cb6ef2c85a8879eaa9581c3f4fac9271ff3200a27}
    environment:
      OPENLEASH_PLUGIN_ID: openleash.mcp-scanner
      OPENLEASH_PLUGIN_RUNTIME_SECRET: ${OPENLEASH_PLUGIN_RUNTIME_SECRET:?Set OPENLEASH_PLUGIN_RUNTIME_SECRET}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - plugin-runtime

  code-scanner:
    image: ${OPENLEASH_PLUGIN_IMAGE_REGISTRY:-ghcr.io/open-leash}/plugin-code-scanner:${OPENLEASH_CODE_SCANNER_VERSION:-1.0.0@sha256:7a5e97f3f840952dda1f8a94ec6ff3af5c1a1e0a2b36aee1f6719180bb1ab461}
    environment:
      OPENLEASH_PLUGIN_ID: openleash.code-scanner
      OPENLEASH_PLUGIN_RUNTIME_SECRET: ${OPENLEASH_PLUGIN_RUNTIME_SECRET:?Set OPENLEASH_PLUGIN_RUNTIME_SECRET}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - plugin-runtime

  skill-scanner:
    image: ${OPENLEASH_PLUGIN_IMAGE_REGISTRY:-ghcr.io/open-leash}/plugin-skill-scanner:${OPENLEASH_SKILL_SCANNER_VERSION:-1.0.2@sha256:746f546c26ba5c0ecacbf559f231186f65b8133de1cd5ae4bb0a4c2e6ad740af}
    environment:
      OPENLEASH_PLUGIN_ID: openleash.skill-scanner
      OPENLEASH_PLUGIN_RUNTIME_SECRET: ${OPENLEASH_PLUGIN_RUNTIME_SECRET:?Set OPENLEASH_PLUGIN_RUNTIME_SECRET}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - plugin-runtime

  siem-exporter:
    image: ${OPENLEASH_PLUGIN_IMAGE_REGISTRY:-ghcr.io/open-leash}/plugin-siem-exporter:${OPENLEASH_SIEM_EXPORTER_VERSION:-1.0.0@sha256:7d41e5ca00d06ec65e75d9db3f8060ee875c2959afcea1537dc514a424048ba4}
    environment:
      OPENLEASH_PLUGIN_ID: openleash.siem-exporter
      OPENLEASH_PLUGIN_RUNTIME_SECRET: ${OPENLEASH_PLUGIN_RUNTIME_SECRET:?Set OPENLEASH_PLUGIN_RUNTIME_SECRET}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - plugin-runtime


volumes:
  openleash-private-cloud-postgres:
  openleash-private-cloud-token-saver:

networks:
  plugin-runtime:
    internal: true
